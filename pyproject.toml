[project]
name = "kb-mcp"
version = "1.0.0"
description = "MCP server for the Knowledge Base: read, write, search and ask across your spaces"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastmcp>=4.0.3,<5.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.7,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "mypy>=1.14",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_mcp"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG001", "T201"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
